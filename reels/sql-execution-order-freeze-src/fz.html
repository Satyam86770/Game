<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:720px;height:1280px;overflow:hidden;background:#000;font-family:'Poppins','Noto Sans Devanagari',sans-serif}
#bg{position:absolute;inset:0;background:url(freeze.png) 0 0/720px 1280px}
#dim{position:absolute;inset:0;background:#05060f;opacity:0}
#q{position:absolute;left:30px;top:140px;width:660px;height:232px;border-radius:14px;
 background:url(freeze.png) -30px -140px/720px 1280px;transform-origin:50% 0%}
#glow{position:absolute;inset:-5px;border-radius:18px;border:5px solid #ffd60a}
#panel{position:absolute;left:0;top:420px;width:720px;height:330px;background:#0a0c1a;opacity:0}
#t1{position:absolute;top:450px;width:100%;text-align:center;color:#fff;font-weight:800;font-size:44px;opacity:0}
#t2{position:absolute;top:525px;width:100%;text-align:center;color:#ffd60a;font-weight:800;font-size:38px;opacity:0}
#emo{position:absolute;left:500px;top:575px;font-size:150px;opacity:0;transform-origin:50% 80%}
#bar{position:absolute;left:160px;top:620px;width:340px;height:16px;border-radius:9px;background:#2a2d45;opacity:0}
#fill{height:100%;border-radius:9px;background:linear-gradient(90deg,#ffd60a,#ff6b35)}
#tm{position:absolute;left:160px;top:648px;color:#cfd3ff;font-weight:700;font-size:26px;opacity:0}
</style></head><body>
<div id="bg"></div><div id="dim"></div>
<div id="q"><div id="glow"></div></div>
<div id="panel"></div><div id="t1">Ruko! ✋ 2 sec socho...</div>
<div id="t2">Isme kya galat hai? 🤔</div>
<div id="bar"><div id="fill"></div></div><div id="tm">⏳ 2</div>
<div id="emo">🤔</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x)=>Math.max(0,Math.min(1,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
window.render=t=>{
 $('panel').style.opacity=ease(t/0.15);$('dim').style.opacity=0.62*ease(t/0.2);
 const s=1+0.05*back(t/0.3);
 $('q').style.transform=`translateY(${-20*ease(t/0.3)}px) scale(${s})`;
 const p=0.5+0.5*Math.sin(t*2*Math.PI*2);
 $('glow').style.boxShadow=`0 0 ${18+30*p}px ${4+8*p}px rgba(255,214,10,${0.55+0.35*p})`;
 $('t1').style.opacity=ease((t-0.1)/0.2); $('t1').style.transform=`translateY(${20*(1-ease((t-0.1)/0.2))}px)`;
 $('t2').style.opacity=ease((t-0.35)/0.2); $('t2').style.transform=`scale(${0.8+0.2*back((t-0.35)/0.3)})`;
 $('emo').style.opacity=cl((t-0.15)/0.1);
 $('emo').style.transform=`scale(${back((t-0.15)/0.35)}) rotate(${Math.sin(t*9)*10}deg)`;
 $('bar').style.opacity=$('tm').style.opacity=ease((t-0.3)/0.2);
 $('fill').style.width=(100*(1-cl((t-0.3)/1.7)))+'%';
 $('tm').textContent='⏳ '+Math.max(1,Math.ceil(2-t));
};
</script></body></html>
