    <text x="146" y="536" fill="#5cd6ff">sum</text><text x="182" y="536" fill="#e8eaf0">+= a[i];</text>
    <text x="132" y="560" fill="#ff79c6">return</text><text x="196" y="560" fill="#ffd166">total-sum</text>
    <rect id="lapCur" x="132" y="572" width="10" height="16" fill="#4ade80"/>
   </g>
