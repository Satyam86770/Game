/* top bar */
#top{position:absolute;left:70px;right:70px;top:120px;display:flex;align-items:center;justify-content:space-between}

.cell{width:150px;text-align:center}

.cell .i{margin-top:8px;font-size:24px;font-weight:800;color:#7d8291;font-family:'DejaVu Sans Mono',monospace}
.cell.miss .v{border:4px dashed #ff5470;color:#ff5470;background:transparent}
.cell.found .v{border-color:#4ade80;color:#4ade80;box-shadow:0 0 50px rgba(74,222,128,.6)}
.card{border-radius:24px;background:#0d1017;padding:22px 30px;border:3px solid #2b303c}
#ask{top:600px}
#ask .card{display:inline-block;font-size:42px;font-weight:800;line-height:1.35;border-color:#ffd166}
#sortC{left:110px;top:330px;width:860px}
#sortC .card{font-size:28px;line-height:1.55;white-space:pre;position:relative;border-color:#ff5470}
#cross{position:absolute;inset:0;pointer-events:none}
#tc{top:700px}

#on{top:340px}

#formula{top:500px}
#formula .card{display:inline-block;padding:26px 44px;border-color:#a78bfa}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin-left:14px}
.frac .t{font-size:58px;font-weight:800;padding:0 14px}
.frac .b{font-size:58px;font-weight:800;border-top:5px solid #fff;padding:0 14px;width:100%;text-align:center}
.lhs{font-size:56px;font-weight:800;vertical-align:middle}
#tot{top:600px}
#tot .card{display:inline-block;border-color:#5cd6ff}
#asum{top:800px}
#asum .card{display:inline-block;font-size:42px;font-weight:800;border-color:#ffd166}
#res{top:930px}
#res .card{display:inline-block;font-size:58px;font-weight:800;border-color:#4ade80;box-shadow:0 0 50px rgba(74,222,128,.4)}
#cx{top:700px}
#cx span{display:inline-block;padding:12px 30px;border-radius:40px;background:#14532d;border:2px solid #4ade80;font-size:40px;font-weight:800}
#cta{top:380px}
#cta .q{display:inline-block;font-size:44px;font-weight:800;line-height:1.35;padding:20px 34px;border-radius:24px;border:3px solid #5cd6ff;background:#0b1620}
#cta .f{margin-top:30px;display:inline-block;padding:18px 54px;border-radius:50px;background:#e8eaf0;color:#08090c;font-size:42px;font-weight:800}
/* caption */
#cap{position:absolute;left:40px;width:1000px;top:1105px;text-align:center;font-size:56px;font-weight:800;line-height:1.2}
#cap .w{color:#5b606c}#cap .on{color:#fff}
/* avatar */
#av{position:absolute;left:0;top:1190px;width:1080px;height:730px}
#ring{position:absolute;left:250px;top:30px;width:580px;height:580px;border-radius:50%;border:3px dashed}
canvas{position:absolute;inset:0;pointer-events:none}

<script>
const TL=window.TL||{K:{},END:60,CAP:[],AMP:[]};const K=TL.K,END=TL.END,CAP=TL.CAP||[],AMP=TL.AMP||[],AOFF=TL.AOFF||0;
const cl=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-cl(x),3),eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};const lerp=(a,b,u)=>a+(b-a)*u;
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const $=id=>document.getElementById(id);
function setA(el,o,dx=0,dy=0,s=1){el.style.opacity=o;el.style.transform=`translate(${dx}px,${dy}px) scale(${s})`}
function win(t,a,b,fi=0.3,fo=0.25){if(a==null)return 0;return ease((t-a)/fi)*(b==null?1:1-ease((t-b)/fo))}
const A=[1,5,2,4];
$('arr').innerHTML=A.map((v,i)=>`<div class="cell" id="c${i}"><div class="v">${v}</div><div class="i">a[${i}]</div></div>`).join('')+`<div class="cell miss" id="cm"><div class="v" id="cmv">?</div><div class="i">missing</div></div>`;
$('seg').innerHTML=Array.from({length:12},()=>'<div></div>').join('');
$('sortT').innerHTML=['<span style="color:#5cd6ff">int</span> findMissing(<span style="color:#5cd6ff">int</span> a[], <span style="color:#5cd6ff">int</span> n) {','  sort(a, a + n - 1);   <span style="color:#7f8bb5">// 😬</span>','  <span style="color:#ff79c6">for</span> (<span style="color:#5cd6ff">int</span> i = 0; i &lt; n - 1; i++)','    <span style="color:#ff79c6">if</span> (a[i] != i + 1) <span style="color:#ff79c6">return</span> i + 1;','  <span style="color:#ff79c6">return</span> n;','}'].join('\n');
// chapters: [start key, label, color]
const CH=[[0,'INTERVIEW Q','#ffd166'],[K.sort,'GALAT TARIKA','#ff5470'],[K.on,'SMART TRICK','#4ade80'],[K.n5,'DRY RUN','#5cd6ff'],[K.res,'ANSWER','#4ade80'],[K.cta,'TUMHARI BAARI','#a78bfa']];
// gestures: [time, pose]
const G=[[0,'wave'],[2.6,'point'],[6.2,'think'],[K.stop-0.3,'stop'],[K.tc,'point'],[K.on,'up'],[K.form,'point'],[K.n5,'count'],[K.res,'thumb'],[K.cx,'point'],[K.cta,'wave']];
const POSE={rest:{u:20,f:-10,fin:0,palm:0,th:0},wave:{u:-150,f:-30,fin:0,palm:1,th:0},point:{u:-150,f:-5,fin:1,palm:0,th:0},up:{u:-160,f:5,fin:1,palm:0,th:0},
 think:{u:-155,f:-125,fin:1,palm:0,th:0},stop:{u:-95,f:-80,fin:0,palm:1,th:0},count:{u:-160,f:10,fin:1,palm:0,th:0},thumb:{u:-120,f:-60,fin:0,palm:0,th:1}};
window.CUES=[];window.READY=false;
function init(){const C=window.CUES,c=(t,n,g=1)=>{if(t!=null)C.push([t,n,g])};
 c(K.stop,'buzz',0.5);c(K.on,'ding',0.6);c(K.form,'whoosh',0.5);c(K.tot,'pop',0.5);(K.add||[]).forEach(x=>c(x,'click',0.6));c(K.asum,'ding',0.5);c(K.res,'success',0.9);c(K.cta,'sparkle',0.6);(K.say||[]).forEach(x=>c(x,'pop',0.35));
 window.READY=true}
const gl=$('glow').getContext('2d'),conf=$('conf').getContext('2d');
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
window.render=function(t){
 // chapter / colors
 let ch=CH[0],ci=0;CH.forEach((c,i)=>{if(t>=c[0]){ch=c;ci=i}});const col=ch[1+1];
 $('chap').textContent='● '+ch[1];$('chap').style.color=col;$('chap').style.borderColor=col;
 const segs=$('seg').children;const nOn=Math.ceil(12*t/END);for(let i=0;i<12;i++)segs[i].className=i<nOn?'on':'';
 gl.clearRect(0,0,1080,1920);let g=gl.createRadialGradient(540,1500,40,540,1500,520);g.addColorStop(0,hexA(col,0.55));g.addColorStop(1,hexA(col,0));gl.fillStyle=g;gl.fillRect(0,900,1080,1020);
 g=gl.createRadialGradient(540,620,40,540,620,600);g.addColorStop(0,hexA(col,0.12));g.addColorStop(1,hexA(col,0));gl.fillStyle=g;gl.fillRect(0,0,1080,1300);
 $('ring').style.borderColor=hexA(col,0.6);$('ring').style.transform=`rotate(${t*8}deg)`;
 // ---- stage ----
 const arrO=t<K.sort?1:(t>=K.n5?ease((t-K.n5)/0.4):1-ease((t-K.sort)/0.3));$('arr').style.opacity=arrO;$('arr').style.transform=`translateY(${t>=K.n5?-30:0}px) scale(${t>=K.n5?0.82:1})`;
 for(let i=0;i<4;i++){const v=$('c'+i).querySelector('.v');const sy=(K.say||[])[i],ad=(K.add||[])[i];const hl=(sy!=null&&t>=sy&&t<sy+0.6)||(ad!=null&&t>=ad&&t<K.asum+0.3);v.style.borderColor=hl?'#ffd166':'#3b4150';v.style.boxShadow=hl?'0 0 34px rgba(255,209,102,.7)':'none'}
 const m=$('cm');if(t>=K.res+0.3){m.className='cell found';$('cmv').textContent='3';m.style.transform=`scale(${back((t-K.res-0.3)/0.4)})`}else{m.className='cell miss';$('cmv').textContent='?';m.style.transform='none'}
 setA($('ask'),win(t,K.ask+0.3,K.sort-0.1),0,0,0.9+0.1*back((t-K.ask-0.3)/0.4));
 setA($('sortC'),win(t,K.sort,K.on-0.1),0,20*(1-ease((t-K.sort)/0.35)));
 let cr='';if(t>=K.stop){const u=ease((t-K.stop)/0.35),u2=ease((t-K.stop-0.25)/0.35);cr=`<line x1="30" y1="30" x2="${30+800*u}" y2="${30+340*u}" stroke="#ff2a4f" stroke-width="14" stroke-linecap="round"/>`+(u2>0?`<line x1="830" y1="30" x2="${830-800*u2}" y2="${30+340*u2}" stroke="#ff2a4f" stroke-width="14" stroke-linecap="round"/>`:'')}$('cross').innerHTML=cr;
 setA($('tc'),win(t,K.tc,K.on-0.1),0,0,0.7+0.3*back((t-K.tc)/0.35));
 setA($('on'),win(t,K.on,K.n5-0.1),0,0,0.85+0.15*back((t-K.on)/0.4));
 const fv=win(t,K.form,K.n5,0.3,0.3);$('formula').style.opacity=fv;$('formula').style.transform=t>=K.n5?`translateY(${lerp(0,-20,eio((t-K.n5)/0.5))}px) scale(${lerp(1,0.66,eio((t-K.n5)/0.5))})`:`scale(${0.9+0.1*back((t-K.form)/0.4)})`;
 if(t>=K.n5)$('formula').style.top=lerp(500,520,eio((t-K.n5)/0.5))+'px';
 setA($('tot'),win(t,K.tot,K.cta-0.1),0,0,0.85+0.15*back((t-K.tot)/0.4));$('totV').style.opacity=t>=K.totv?1:0;
 const ad=K.add||[];let s='';for(let i=0;i<4;i++)if(t>=ad[i])s+=(i?' + ':'')+`<y>${A[i]}</y>`;$('asumT').innerHTML=`Array Sum = ${s||'…'}${t>=K.asum?' = <y>12</y>':''}`;setA($('asum'),win(t,ad[0],K.cta-0.1));
 setA($('res'),win(t,K.res,K.cta-0.1),0,0,0.6+0.4*back((t-K.res)/0.45));
 setA($('cx'),win(t,K.cx,K.cta-0.1),0,0,0.85+0.15*back((t-K.cx)/0.4));if(t>=K.cx){$('tot').style.opacity=0;$('formula').style.opacity=0;$('asum').style.top='560px';$('res').style.top='860px';$('cx').style.top='420px'}else{$('asum').style.top='800px';$('res').style.top='930px'}
 setA($('cta'),win(t,K.cta,null,0.35),0,30*(1-ease((t-K.cta)/0.4)));if(t>=K.cta)$('arr').style.opacity=0;
 // ---- caption: current chunk, spoken words white ----
 let cap='';for(const [s0,e0,words] of CAP){if(t>=s0&&t<e0+0.15){cap=words.map(([w,ws])=>`<span class="${t>=ws?'on':'w'}">${w}</span>`).join(' ');break}}$('cap').innerHTML=cap;
 // ---- avatar ----
 const fi=Math.floor((t-AOFF)*30);const a=fi>=0&&fi<AMP.length?(AMP[fi]+(AMP[fi+1]||0))/2:0;
 const open=Math.min(1,a*1.1);
 $('mOut').setAttribute('d',`M-34 0 Q0 ${10+6*open} 34 0 Q0 ${8+44*open} -34 0 Z`);$('mTeeth').setAttribute('opacity',open>0.15?1:0.4);
 const hb=Math.sin(t*2.1)*3+open*4;$('head').setAttribute('transform',`translate(${540+Math.sin(t*1.3)*4},${300+hb}) rotate(${Math.sin(t*0.9)*2.5+(open-0.3)*2})`);
